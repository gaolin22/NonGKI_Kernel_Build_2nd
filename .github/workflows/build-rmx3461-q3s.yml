name: Build Realme Q3S (RMX3461) Kernel (KSU)
on:
  workflow_call:
  workflow_dispatch:
env:
  DEVICE_NAME: "realme_q3s"
  DEVICE_CODENAME: "RMX3461"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LLVM=1 LLVM_IAS=1 LD=ld.lld"
  KERNEL_SOURCE: "https://github.com/YouandYu/realme_Q3s_Q3t_9-5G-Speed-AndroidS-kernel-source"
  KERNEL_BRANCH: "master"
  CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
  CLANG_BRANCH: ""
  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz"
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/lahaina-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "bakasu"
  SUSFS_ENABLE: "false"
  SUSFS_FIXED: "false"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "realme-ui-3.0-a12-5.4-qgki"
  PYTHON_VERSION: "3.11"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "main"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"
  FGETPRIORITY_ENABLE: "false"
  VPNHIDE_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Realme Q3S (RMX3461) 5.4.254-qgki KSU
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env
        with:
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready
        with:
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Patch KGDB brk imm
        run: |
          set -e
          FILE="$(find "$GITHUB_WORKSPACE" -path '*/arch/arm64/include/asm/kgdb.h' 2>/dev/null | head -n1)"
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            echo "Patching $FILE"
            sed -i 's/"I"[[:space:]]*(KGDB_COMPILED_DBG_BRK_IMM)/"i" (KGDB_COMPILED_DBG_BRK_IMM)/g' "$FILE"
            grep -n "KGDB_COMPILED_DBG_BRK_IMM" "$FILE" || true
          else
            echo "::warning::kgdb.h not found, skip"
          fi

      - name: Patch stack_pointer for Clang
        run: |
          set -e
          FILE="$(find "$GITHUB_WORKSPACE" -path '*/arch/arm64/include/asm/stack_pointer.h' 2>/dev/null | head -n1)"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "::warning::stack_pointer.h not found, skip"
            exit 0
          fi
          echo "Patching $FILE"
          sed -i 's/register unsigned long current_stack_pointer asm ("sp");/static inline unsigned long current_stack_pointer(void) { unsigned long sp; asm volatile ("mov %0, sp" : "=r" (sp)); return sp; }/g' "$FILE"
          if grep -q "static inline unsigned long current_stack_pointer" "$FILE"; then
            echo "stack_pointer patch applied successfully."
          else
            echo "::warning::stack_pointer patch may have failed."
          fi

      - name: Patch openvswitch UAPI header leak
        run: |
          set -e
          FILE="$(find "$GITHUB_WORKSPACE" -path '*/include/uapi/linux/openvswitch.h' 2>/dev/null | head -n1)"
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            echo "Patching UAPI header: $FILE"
            sed -i 's/OVS_METER_BAND_TYPE_UNSPEC,/OVS_METER_BAND_TYPE_UNSPEC,\t\/\* Unspecified. \*\//' "$FILE"
            sed -i 's/OVS_METER_BAND_TYPE_DROP,/OVS_METER_BAND_TYPE_DROP,\t\/\* Drop exceeding packets. \*\//' "$FILE"
            echo "openvswitch.h patched."
          else
            echo "::warning::openvswitch.h not found, skip"
          fi

      - name: Generate Kernel Config
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "Generating defconfig: ${DEFCONFIG_NAME}"
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "${DEFCONFIG_NAME}"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          if [ -f out/.config ]; then
            echo "Config generated successfully."
          else
            echo "::error::Failed to generate out/.config!"
            exit 1
          fi

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
